<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H&H Project Creator</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 600px;
      width: 100%;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    .btn-create {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-create:hover {
      background-color: #1d4ed8;
    }

    /* Modal Stili */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      background: #ffffff;
      width: 90%;
      max-width: 450px;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
    }

    .modal h3 {
      margin-bottom: 15px;
      font-size: 1.25rem;
    }

    .modal textarea {
      width: 100%;
      height: 100px;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 20px;
      outline: none;
      resize: vertical;
    }

    .modal textarea:focus {
      border-color: #2563eb;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-cancel {
      background: #e2e8f0;
      color: #475569;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .project-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .project-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      padding: 15px 20px;
      border-radius: 10px;
    }

    .project-card a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
      word-break: break-all;
    }

    /* Layihə Səhifəsi Görünüşü */
    #projectPage {
      display: none;
      text-align: center;
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 600px;
      margin-top: 60px; /* Reklam örtməsin deyə üst boşluq */
    }

    .content-box {
      font-size: 1.8rem;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 15px;
      word-wrap: break-word;
    }
  </style>
</head>
<body>

  <!-- Əsas Dashboard -->
  <div class="container" id="mainDashboard">
    <div class="header">
      <h2>Layihələrim</h2>
      <button class="btn-create" onclick="openModal()">+ Create new project</button>
    </div>

    <div class="project-list" id="projectsContainer"></div>
  </div>

  <!-- Ağ Pəncərə (Modal) -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>Yeni Layihə Yarat</h3>
      <textarea id="projectInput" placeholder="İstədiyiniz sözü və ya mətni yazın..."></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Ləğv et</button>
        <button class="btn-create" onclick="createProject()">Link Oluşdur</button>
      </div>
    </div>
  </div>

  <!-- Yaradılan Avtomatik Layihə Səhifəsi -->
  <div id="projectPage">

    <!-- BEGIN AADS AD UNIT 2459007 -->
    <div style="position: absolute; z-index: 99999">
      <input autocomplete="off" type="checkbox" id="aadsstickymvdz2m6o" hidden />
      <div style="padding-top: auto; padding-bottom: 0;">
        <div style="width:100%;height:auto;position:fixed;text-align:center;font-size:0;top:0;left:0;right:0;margin:auto">
          <label for="aadsstickymvdz2m6o" style="top: 50%;transform: translateY(-50%);right:24px;; position: absolute;border-radius: 4px; background: rgba(248, 248, 249, 0.70); padding: 4px;z-index: 99999;cursor:pointer">
            <svg fill="#000000" height="16px" width="16px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 490">
              <polygon points="456.851,0 245,212.564 33.149,0 0.708,32.337 212.669,245.004 0.708,457.678 33.149,490 245,277.443 456.851,490 489.292,457.678 277.331,245.004 489.292,32.337 "/>
            </svg>
          </label>
          <div id="frame" style="width: 100%;margin: auto;position: relative; z-index: 99998;"><iframe data-aa=2459007 src=//acceptable.a-ads.com/2459007/?size=Adaptive style='border:0; padding:0; width:70%; height:auto; overflow:hidden; margin: auto'></iframe></div>
        </div>
        <style>
          #aadsstickymvdz2m6o:checked + div {
            display: none;
          }
        </style>
      </div>
    </div>
    <!-- END AADS AD UNIT 2459007 -->

    <div class="content-box" id="pageContent">Yüklənir...</div>
    <p style="color: #64748b; margin-bottom: 25px;">Uğurla yaradılmış xüsusi layihə səhifəsindəsiniz!</p>
    <button class="btn-cancel" onclick="goBack()">← Geri Qayıt</button>
  </div>

  <script>
    function openModal() {
      document.getElementById('modalOverlay').style.display = 'flex';
      document.getElementById('projectInput').focus();
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
      document.getElementById('projectInput').value = '';
    }

    function createProject() {
      const text = document.getElementById('projectInput').value.trim();
      if (!text) return;

      // Mətni URL üçün təhlükəsiz Base64 formatına salırıq
      const encodedText = encodeURIComponent(btoa(unescape(encodeURIComponent(text))));
      
      const baseUrl = window.location.origin + window.location.pathname;
      const projectUrl = baseUrl + '?data=' + encodedText;

      const container = document.getElementById('projectsContainer');
      const card = document.createElement('div');
      card.className = 'project-card';
      card.innerHTML = `
        <p style="margin-bottom: 8px;"><strong>Mətn:</strong> ${text}</p>
        <a href="${projectUrl}">${projectUrl}</a>
      `;

      container.appendChild(card);
      closeModal();
    }

    function checkURL() {
      const urlParams = new URLSearchParams(window.location.search);
      const data = urlParams.get('data');

      if (data) {
        document.getElementById('mainDashboard').style.display = 'none';
        document.getElementById('projectPage').style.display = 'block';

        try {
          // Linkdəki koda çevrilmiş mətni geri oxuyur
          const decodedText = decodeURIComponent(escape(atob(decodeURIComponent(data))));
          document.getElementById('pageContent').textContent = decodedText;
        } catch (e) {
          document.getElementById('pageContent').textContent = "Məlumat oxuna bilmədi!";
        }
      }
    }

    function goBack() {
      window.location.href = window.location.origin + window.location.pathname;
    }

    // Səhifə açıldıqda URL-i yoxlayırıq
    window.onload = checkURL;
  </script>

</body>
</html>
