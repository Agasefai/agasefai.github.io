<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Səhifə tapılmadı</title>
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { font-size: 80px; margin: 0; color: #ff5252; }
        p { color: #b0b0b0; margin-bottom: 30px; }
        #user-info { margin-top: 20px; color: #4CAF50; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>404</h1>
        <p>Axtardığınız səhifə tapılmadı və ya silinib.</p>

        <!-- Google Sign-In Düyməsi -->
        <div id="g_id_onload"
             data-client_id="952093460553-7vfmmhik4991k29o4coc5fqbshmnvpnl.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        
        <div class="g_id_signin"
             data-type="standard"
             data-shape="rectangular"
             data-theme="outline"
             data-text="sign_in_with"
             data-size="large"
             data-logo_alignment="left">
        </div>

        <div id="user-info"></div>
    </div>

    <script>
        function handleCredentialResponse(response) {
            const responsePayload = parseJwt(response.credential);
            
            const userName = responsePayload.name;
            const userEmail = responsePayload.email;
            
            // Məlumatı localStorage-da saxlayırıq
            localStorage.setItem('google_user', JSON.stringify({ name: userName, email: userEmail }));
            
            document.getElementById('user-info').innerText = `Xoş gəldiniz, ${userName} (${userEmail})!`;
        }

        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        window.onload = function() {
            const savedUser = localStorage.getItem('google_user');
            if (savedUser) {
                const user = JSON.parse(savedUser);
                document.getElementById('user-info').innerText = `Xoş gəldiniz, ${user.name}!`;
            }
        }
    </script>
</body>
    </html>
