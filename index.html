<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H&H Project Creator</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 600px;
      width: 100%;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    .btn-create {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-create:hover {
      background-color: #1d4ed8;
    }

    /* Modalların (Ağ Pəncərənin) Stili */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      background: #ffffff;
      width: 90%;
      max-width: 450px;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
    }

    .modal h3 {
      margin-bottom: 15px;
      font-size: 1.25rem;
    }

    .modal input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 20px;
      outline: none;
    }

    .modal input:focus {
      border-color: #2563eb;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-cancel {
      background: #e2e8f0;
      color: #475569;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .project-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .project-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      padding: 15px 20px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .project-card a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
      word-break: break-all;
    }

    .project-card a:hover {
      text-decoration: underline;
    }

    /* Layihə Səhifəsi Görünüşü */
    #projectPage {
      display: none;
      text-align: center;
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>

  <!-- Əsas Dashboard -->
  <div class="container" id="mainDashboard">
    <div class="header">
      <h2>Layihələrim</h2>
      <button class="btn-create" onclick="openModal()">+ Create new project</button>
    </div>

    <div class="project-list" id="projectsContainer">
      <!-- Yaradılan linklər bura əlavə olunacaq -->
    </div>
  </div>

  <!-- Ağ Pəncərə (Modal) -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>Yeni Layihə Yarat</h3>
      <input type="text" id="projectInput" placeholder="Söz və ya layihə adı yazın...">
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Ləğv et</button>
        <button class="btn-create" onclick="createProject()">Link Oluşdur</button>
      </div>
    </div>
  </div>

  <!-- Keçid Edilən Şəxsi Layihə Səhifəsi -->
  <div class="container" id="projectPage">
    <h1 id="pageTitle" style="font-size: 2rem; color: #2563eb; margin-bottom: 15px;"></h1>
    <p style="color: #64748b; margin-bottom: 25px;">Uğurla yaradılmış xüsusi layihə səhifəsindəsiniz!</p>
    <button class="btn-cancel" onclick="goBack()">← Geri Qayıt</button>
  </div>

  <script>
    // Səhifə açılanda URL-də hash (#) varmı deyə yoxlayır
    window.onload = function() {
      checkRoute();
    };

    window.onhashchange = function() {
      checkRoute();
    };

    function openModal() {
      document.getElementById('modalOverlay').style.display = 'flex';
      document.getElementById('projectInput').focus();
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
      document.getElementById('projectInput').value = '';
    }

    function createProject() {
      const text = document.getElementById('projectInput').value.trim();
      if (!text) return;

      // Link üçün təhlükəsiz URL slug yaradırıq
      const slug = encodeURIComponent(text);
      const projectUrl = window.location.origin + window.location.pathname + '#' + slug;

      // Yeni kart yaradıb siyahıya əlavə edirik
      const container = document.getElementById('projectsContainer');
      const card = document.createElement('div');
      card.className = 'project-card';
      card.innerHTML = `
        <div>
          <strong>${text}</strong><br>
          <a href="${projectUrl}">${projectUrl}</a>
        </div>
      `;

      container.appendChild(card);
      closeModal();
    }

    function checkRoute() {
      const hash = window.location.hash.replace('#', '');
      const mainDashboard = document.getElementById('mainDashboard');
      const projectPage = document.getElementById('projectPage');
      const pageTitle = document.getElementById('pageTitle');

      if (hash) {
        // Əgər URL-də #söz varsa həmin səhifəni açır
        mainDashboard.style.display = 'none';
        projectPage.style.display = 'block';
        pageTitle.textContent = decodeURIComponent(hash);
      } else {
        // Yoxdursa əsas paneli gösterir
        mainDashboard.style.display = 'block';
        projectPage.style.display = 'none';
      }
    }

    function goBack() {
      window.location.hash = '';
    }
  </script>

</body>
</html>
