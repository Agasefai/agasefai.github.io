<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H&H Project Creator</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 600px;
      width: 100%;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    .btn-create {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-create:hover {
      background-color: #1d4ed8;
    }

    /* Modal Stili */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      background: #ffffff;
      width: 90%;
      max-width: 450px;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
    }

    .modal h3 {
      margin-bottom: 15px;
      font-size: 1.25rem;
    }

    .modal textarea {
      width: 100%;
      height: 100px;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 20px;
      outline: none;
      resize: vertical;
    }

    .modal textarea:focus {
      border-color: #2563eb;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-cancel {
      background: #e2e8f0;
      color: #475569;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .project-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .project-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      padding: 15px 20px;
      border-radius: 10px;
    }

    .project-card a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
      word-break: break-all;
    }

    /* Layihə Səhifəsi Görünüşü */
    #projectPage {
      display: none;
      text-align: center;
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 600px;
    }

    .content-box {
      font-size: 1.5rem;
      font-weight: 600;
      color: #2563eb;
      margin-bottom: 20px;
      word-wrap: break-word;
    }
  </style>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // BURAYA ƏVƏZ ET: Firebase layihə parametrlərin
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Qlobal funksiyaları təyin edirik
    window.openModal = () => document.getElementById('modalOverlay').style.display = 'flex';
    window.closeModal = () => document.getElementById('modalOverlay').style.display = 'none';

    // Yeni layihəni Firebase-ə yazır və keçid yaradır
    window.createProject = async () => {
      const text = document.getElementById('projectInput').value.trim();
      if (!text) return;

      try {
        const docRef = await addDoc(collection(db, "projects"), {
          content: text,
          createdAt: new Date()
        });

        const projectUrl = window.location.origin + window.location.pathname + '?id=' + docRef.id;
        
        const container = document.getElementById('projectsContainer');
        const card = document.createElement('div');
        card.className = 'project-card';
        card.innerHTML = `
          <p style="margin-bottom: 8px;"><strong>Mətn:</strong> ${text}</p>
          <a href="${projectUrl}" target="_blank">${projectUrl}</a>
        `;
        container.appendChild(card);
        closeModal();
        document.getElementById('projectInput').value = '';
      } catch (e) {
        alert("Xəta baş verdi: " + e.message);
      }
    };

    // Keçid olunan ID üzrə məlumatı bazadan çəkir
    async function loadProject() {
      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get('id');

      if (projectId) {
        document.getElementById('mainDashboard').style.display = 'none';
        document.getElementById('projectPage').style.display = 'block';

        try {
          const docRef = doc(db, "projects", projectId);
          const docSnap = await getDoc(docRef);

          if (docSnap.exists()) {
            document.getElementById('pageContent').textContent = docSnap.data().content;
          } else {
            document.getElementById('pageContent').textContent = "Layihə tapılmadı!";
          }
        } catch (e) {
          document.getElementById('pageContent').textContent = "Məlumat yüklənərkən xəta yarandı.";
        }
      }
    }

    window.goBack = () => {
      window.location.href = window.location.origin + window.location.pathname;
    };

    loadProject();
  </script>
</head>
<body>

  <!-- Əsas Dashboard -->
  <div class="container" id="mainDashboard">
    <div class="header">
      <h2>Layihələrim</h2>
      <button class="btn-create" onclick="openModal()">+ Create new project</button>
    </div>

    <div class="project-list" id="projectsContainer"></div>
  </div>

  <!-- Ağ Pəncərə (Modal) -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>Yeni Layihə Yarat</h3>
      <textarea id="projectInput" placeholder="İstədiyiniz sözü və ya məti yazın..."></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Ləğv et</button>
        <button class="btn-create" onclick="createProject()">Link Oluşdur</button>
      </div>
    </div>
  </div>

  <!-- Yaradılan Avtomatik Layihə Səhifəsi -->
  <div id="projectPage">
    <div class="content-box" id="pageContent">Yüklənir...</div>
    <p style="color: #64748b; margin-bottom: 25px;">Uğurla yaradılmış xüsusi layihə səhifəsindəsiniz!</p>
    <button class="btn-cancel" onclick="goBack()">← Geri Qayıt</button>
  </div>

</body>
</html>
