<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Found - Moderasiya</title>
    <!-- Google Fonts: Balon şrifti (Fredoka) və müasir yazı şrifti (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome İkonları (Ödəniş və digər simvollar üçün) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px 20px 20px;
        }

        .main-container {
            max-width: 650px;
            width: 100%;
            text-align: center;
            margin: auto;
        }

        /* Balon şriftində mavi 404 Found */
        .title-404 {
            font-family: 'Fredoka', cursive;
            font-size: 4rem;
            color: #1e90ff;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px #e6f0ff;
        }

        .status-text {
            font-size: 0.95rem;
            color: #555555;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Taymer bölməsi */
        .timer-box {
            background: #f4f8ff;
            border: 1px solid #d0e3ff;
            border-radius: 12px;
            padding: 15px 25px;
            display: inline-block;
            margin-bottom: 25px;
        }

        .timer-label {
            font-size: 0.8rem;
            color: #666666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .timer-display {
            font-family: 'Fredoka', cursive;
            font-size: 2.2rem;
            color: #1e90ff;
        }

        /* Moderatör bölməsi */
        .moderator-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            font-size: 0.95rem;
            color: #444444;
            font-weight: 500;
        }

        .hb-badge {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: #1e90ff;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fredoka', cursive;
            font-size: 1rem;
            box-shadow: 0 2px 6px rgba(30, 144, 255, 0.3);
        }

        /* Şərh bölməsi */
        .comments-section {
            background-color: #fafafa;
            border: 1px solid #eeeeee;
            border-radius: 12px;
            padding: 20px;
            text-align: left;
            margin-bottom: 40px;
        }

        .comments-section h3 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: #333333;
        }

        .comment-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .comment-input-group input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .comment-input-group input:focus {
            border-color: #1e90ff;
        }

        .comment-input-group button {
            background-color: #1e90ff;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        .comment-input-group button:hover {
            background-color: #107acc;
        }

        .comments-list {
            max-height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .comment-item {
            background: #ffffff;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            font-size: 0.85rem;
            word-break: break-word;
        }

        /* Footer & İkonlar */
        footer {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
        }

        .payment-icons {
            display: flex;
            gap: 20px;
            font-size: 1.8rem;
            color: #666666;
        }

        .payment-icons i:hover {
            color: #1e90ff;
        }

        /* Çərəz (Cookie) Banneri */
        .cookie-banner {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #222222;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            font-size: 0.85rem;
            z-index: 1000;
            width: 90%;
            max-width: 500px;
        }

        .cookie-banner button {
            background-color: #1e90ff;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
        }

        .cookie-banner button:hover {
            background-color: #107acc;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Mavi Balon Şriftində 404 Found -->
        <h1 class="title-404">404 Found</h1>

        <!-- Status Mətni -->
        <p class="status-text">Bu site şu anda moderatör tarafından inceleniliyor.</p>

        <!-- 1 Saat 30 Dəqiqəlik Sabit Geri Sayım -->
        <div class="timer-box">
            <div class="timer-label">Qalan Moderasiya Müddəti</div>
            <div class="timer-display" id="timer">01:30:00</div>
        </div>

        <!-- Moderatör Məlumatı -->
        <div class="moderator-info">
            <span>Siteyi inceleyen moderatör: Hesen Bagirov and Hüseyn Bagirov</span>
            <div class="hb-badge">HB</div>
        </div>

        <!-- Şərh Bölməsi -->
        <div class="comments-section">
            <h3>Şərhlər</h3>
            <div class="comment-input-group">
                <input type="text" id="commentInput" placeholder="Şərhinizi yazın...">
                <button onclick="addComment()">Göndər</button>
            </div>
            <div class="comments-list" id="commentsList">
                <!-- Yazılan şərhlər bura əlavə olunacaq -->
            </div>
        </div>
    </div>

    <!-- Səhifənin Alt Hissəsi (Ödəniş / İkonlar) -->
    <footer>
        <div class="payment-icons">
            <i class="fa-brands fa-paypal" title="PayPal"></i>
            <i class="fa-brands fa-google" title="Google"></i>
            <i class="fa-brands fa-cc-visa" title="Visa"></i>
            <i class="fa-brands fa-cc-mastercard" title="Mastercard"></i>
        </div>
    </footer>

    <!-- Çərəzlər (Cookies) Xəbərdarlığı -->
    <div class="cookie-banner" id="cookieBanner">
        <span>Səhifənin düzgün işləməsi üçün çərəzlərdən (cookies) istifadə olunur.</span>
        <button onclick="acceptCookies()">Qəbul et</button>
    </div>

    <script>
        // --- Sabit 1 Saat 30 Dəqiqəlik Taymer ---
        // Səhifə yenilənsə də vaxt sıfırlanmır (localStorage istifadə olunur)
        const COUNTDOWN_TIME = 90 * 60 * 1000; // 1 saat 30 dəqiqə = 5400 saniyə (milli-saniyə ilə)

        let endTime = localStorage.getItem('moderation_end_time');

        if (!endTime) {
            endTime = Date.now() + COUNTDOWN_TIME;
            localStorage.setItem('moderation_end_time', endTime);
        }

        function updateTimer() {
            const now = Date.now();
            const distance = endTime - now;

            if (distance <= 0) {
                document.getElementById('timer').innerText = "00:00:00";
                clearInterval(timerInterval);
                return;
            }

            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            const format = (num) => String(num).padStart(2, '0');

            document.getElementById('timer').innerText = `${format(hours)}:${format(minutes)}:${format(seconds)}`;
        }

        updateTimer();
        const timerInterval = setInterval(updateTimer, 1000);


        // --- Şərh Sistemi ---
        function loadComments() {
            const comments = JSON.parse(localStorage.getItem('site_comments') || '[]');
            const list = document.getElementById('commentsList');
            list.innerHTML = '';
            comments.forEach(c => {
                const item = document.createElement('div');
                item.className = 'comment-item';
                item.innerText = c;
                list.appendChild(item);
            });
        }

        function addComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (text) {
                const comments = JSON.parse(localStorage.getItem('site_comments') || '[]');
                comments.push(text);
                localStorage.setItem('site_comments', JSON.stringify(comments));
                input.value = '';
                loadComments();
            }
        }

        loadComments();


        // --- Çərəzlər (Cookie) Banneri ---
        if (localStorage.getItem('cookies_accepted') === 'true') {
            document.getElementById('cookieBanner').style.display = 'none';
        }

        function acceptCookies() {
            localStorage.setItem('cookies_accepted', 'true');
            document.getElementById('cookieBanner').style.display = 'none';
        }
    </script>
</body>
</html>
